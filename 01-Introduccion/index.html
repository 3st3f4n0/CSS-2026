<!-- 
Propiedades de texto: color, font size. 
-->

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Introducción a CSS</title>
</head>
<body>
    <!-- 1. CSS dentro del elemento <style>...</style> -->
    <style>

        h1 {
            color: red; 
            font-size: 48px; 
        }

    </style>

    <h1> Introducción a CSS</h1>

    <!-- 2. Escribimos CSS en línea. Dentro de la etiqueta de apertura de un elemento de HTML.-->
    <p style="color: blue; font-size: 36px; font-family:'Times New Roman', Times, serif;">Lorem ipsum dolor, sit amet consectetur adipisicing elit. Quaerat molestiae deleniti dolorum numquam eos iure excepturi incidunt officiis unde, alias accusantium libero doloremque exercitationem obcaecati ratione? Modi explicabo minima ratione.</p>

    <!-- Escrbimos CSS en un documento externo. Lo llamamos a través de la etiqueta "link"-->

    <h2>CSS Externo</h2>
    <link rel="stylesheet" href="./Style.css"> </link> 
</body>
</html>
